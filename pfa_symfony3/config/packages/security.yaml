security:
    password_hashers:
        App\Entity\user\Utilisateur:
            algorithm: auto

    providers:
        app_user_provider:
            entity:
                class: App\Entity\user\Utilisateur
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        login:
            pattern: ^/api/login
            security: false  # Votre AuthController gère le login manuellement

        api:
            pattern: ^/api
            stateless: true
            jwt: ~

    access_control:
        - { path: ^/api/login,          roles: PUBLIC_ACCESS }
        - { path: ^/api/forgot-password, roles: PUBLIC_ACCESS }
        - { path: ^/api/reset-password,  roles: PUBLIC_ACCESS }
        - { path: ^/api/set-password,    roles: PUBLIC_ACCESS }
        - { path: ^/api/admin,           roles: ROLE_ADMIN }
        - { path: ^/api,                 roles: IS_AUTHENTICATED_FULLY }