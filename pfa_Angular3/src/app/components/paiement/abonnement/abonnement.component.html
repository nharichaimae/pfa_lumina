<div class="payment-wrapper">
  <div class="payment-card">
    
    <div class="header-section">
      <h2 class="title">{{ 'SUBSCRIPTION.TITLE' | translate }}</h2>
      <p class="subtitle">{{ 'SUBSCRIPTION.SUBTITLE' | translate }}</p>
      <div class="divider"></div>
    </div>

    <form [formGroup]="abonnementForm" (ngSubmit)="creerAbonnement()">

      <!-- EMAIL -->
      <div class="form-group">
        <label class="input-label">{{ 'SUBSCRIPTION.EMAIL' | translate }}</label>
        <div class="input-container">
          <i class="feather icon-mail"></i>
          <input type="email"
                 formControlName="email"
                 [placeholder]="'SUBSCRIPTION.EMAIL_PLACEHOLDER' | translate">
        </div>
      </div>

      <!-- ZONE CARTE STRIPE -->
      <div class="form-group">
        <label class="input-label">{{ 'SUBSCRIPTION.CARD' | translate }}</label>
        <div id="card-element" class="stripe-card-box">
          <!-- Stripe mount ici -->
        </div>
      </div>

      <!-- BOUTON AVEC VOTRE DÉGRADÉ -->
      <button class="pay-button"
              type="submit"
              [disabled]="abonnementForm.invalid">
        <span class="btn-text">{{ 'SUBSCRIPTION.CREATE' | translate }}</span>
        <i class="feather icon-arrow-right"></i>
      </button>

    </form>
    
  

  </div>
</div>
