<!-- CAS 1 : PIÈCES EXISTANTES -->
<ng-container *ngIf="pieces && pieces.length > 0; else noPieces">

  <div class="pieces-container">
    <div class="piece-card" *ngFor="let piece of pieces">
      <div class="piece-header">
        <h3 style="display:flex; align-items:center; gap:10px;">
          <i *ngIf="piece.icon || piece.Icon"
             [class]="piece.icon || piece.Icon"
             style="font-size:20px;">
          </i>
          {{ piece.nom || piece.typeNom || piece.TypeNom }}
        </h3>
        <div class="piece-actions">
          <button class="menu-btn"
                  (click)="piece.showMenu = !piece.showMenu"
                  [attr.aria-label]="'DASHBOARD.MENU_OPTIONS' | translate">
            ⋮
          </button>
         <div class="menu-dropdown" *ngIf="piece.showMenu">
<button (click)="goToAddEquipement(piece.id); piece.showMenu=false">
  ➕ {{ 'PIECE.ADD_EQUIPMENT' | translate }}
</button>
<button (click)="duplicatePiece(piece.id); piece.showMenu=false">
  📋 {{ 'PIECE.DUPLICATE' | translate }}
</button>
<button class="btn-delete" (click)="deletePiece(piece.id); piece.showMenu=false">
  🗑️ {{ 'PIECE.DELETE' | translate }}
</button>
</div>
        </div>
      </div>

      <ul class="equipements-list">
        <li *ngFor="let equip of (piece.equipements || [])">
          <span style="display:flex; align-items:center; gap:10px;">
            <i *ngIf="equip.icon || equip.Icon"
               [class]="equip.icon || equip.Icon"
               style="font-size:18px;">
            </i>
            {{ equip.nom || equip.typeNom || equip.TypeNom }}
          </span>
          <div class="equip-actions">
            <label class="switch"
                   [attr.aria-label]="'DASHBOARD.TOGGLE_EQUIP' | translate">
              <input type="checkbox"
                     [(ngModel)]="equip.etat"
                     (change)="toggleEquip(equip)">
              <span class="slider round"></span>
            </label>
            <button class="config-btn"
                    (click)="goToCondition(equip)"
                    [title]="'DASHBOARD.CONFIGURE' | translate">
              ⚡
            </button>
            <button class="delete-btn"
                    (click)="deleteEquip(equip.id)"
                    [attr.aria-label]="'DASHBOARD.DELETE_EQUIPMENT' | translate">
              🗑️
            </button>
          </div>
        </li>
      </ul>
    </div>

    <!-- BOUTON COMMANDE VOCALE -->
    <div class="voice-section">
      <button
        class="voice-global-btn"
        (click)="toggleVoice()"
        [class.recording]="isRecording"
        [attr.aria-label]="(isRecording
          ? 'DASHBOARD.VOICE_STOP'
          : 'DASHBOARD.VOICE_START') | translate">
        <div class="voice-wave">
          <span></span><span></span><span></span>
          <span></span><span></span>
        </div>
        <i class="fa-solid fa-microphone"></i>
      </button>
    </div>
  </div>

</ng-container>

<!-- CAS 2 : AUCUNE PIÈCE (EMPTY STATE) -->
<ng-template #noPieces>
  <div class="empty-state-container">
    <div class="empty-illustration">
      <i class="feather icon-home"></i>
    </div>
    <h2>{{ 'DASHBOARD.NO_PIECES_TITLE' | translate }}</h2>
    <p>{{ 'DASHBOARD.NO_PIECES_DESC' | translate }}</p>
    <button class="btn-primary-lumina" (click)="goToPieces()">
      <i class="feather icon-plus"></i>
      {{ 'DASHBOARD.ADD_FIRST_PIECE' | translate }}
    </button>
  </div>
</ng-template>
