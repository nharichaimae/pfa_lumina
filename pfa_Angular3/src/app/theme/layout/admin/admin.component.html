<div class="layout">
  <app-simple-nav [class.sidebar-hidden]="fullPage"></app-simple-nav>

  <div class="main">
    <header class="navbar" [class.scrolled]="isScrolled">
      <div class="navbar-left">
        <button class="icon-btn menu-btn" (click)="toggleSidebar()">
          <i class="feather icon-menu"></i>
        </button>

        <div class="navbar-logo" *ngIf="fullPage">
          <img src="assets/images/image2.png" alt="Lumina Smart Home" class="brand-logo">
          <div class="logo-text">
            <span class="logo-title">LUMINA</span>
            <span class="logo-subtitle">SMART HOME</span>
          </div>
        </div>

        <button class="icon-btn" (click)="toggleFullscreen()">
          <i
            class="feather"
            [ngClass]="screenFull ? 'icon-minimize' : 'icon-maximize'"
          ></i>
        </button>

        <app-nav-search></app-nav-search>
      </div>

      <div class="navbar-right">
        <app-nav-right></app-nav-right>
      </div>
    </header>

    <main class="content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
