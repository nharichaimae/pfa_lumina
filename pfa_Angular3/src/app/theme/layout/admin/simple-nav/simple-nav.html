<div class="overlay" *ngIf="isMobile && isOpen" (click)="isOpen = false"></div>

<nav class="sidebar" [class.open]="isOpen">
  <div class="brand">
    <img src="assets/images/image2.png" alt="Lumina Smart Home" class="brand-logo">

    <div class="brand-text">
      <span class="brand-title">LUMINA</span>
      <span class="brand-subtitle">SMART HOME</span>
    </div>
  </div>

  <ul *ngIf="isAdmin()">
    <li
      routerLink="/dashboard"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      (click)="closeSidebarOnMobile()"
    >
      <i class="feather icon-home"></i>
      <span>Dashboard</span>
    </li>

    <li
      routerLink="/clients"
      routerLinkActive="active"
      (click)="closeSidebarOnMobile()"
    >
      <i class="feather icon-users"></i>
      <span>Comptes</span>
    </li>

    <li
      routerLink="/admin-profile"
      routerLinkActive="active"
      (click)="closeSidebarOnMobile()"
    >
      <i class="feather icon-user"></i>
      <span>Profil</span>
    </li>

    <li
      routerLink="/historique-paiement"
      routerLinkActive="active"
      (click)="closeSidebarOnMobile()"
    >
      <i class="feather icon-credit-card"></i>
      <span>Paiement</span>
    </li>
  </ul>

  <ul *ngIf="isClient()">
    <li
      routerLink="/client-dash"
      routerLinkActive="active"
      (click)="closeSidebarOnMobile()"
    >
      <i class="feather icon-home"></i>
      <span>Dashboard</span>
    </li>

    <li
      routerLink="/client-profile"
      routerLinkActive="active"
      (click)="closeSidebarOnMobile()"
    >
      <i class="feather icon-user"></i>
      <span>Profil</span>
    </li>

    <li
      routerLink="/pieces"
      routerLinkActive="active"
      (click)="closeSidebarOnMobile()"
    >
      <i class="feather icon-plus-square"></i>
      <span>Piece</span>
    </li>

    <li
      routerLink="/client-historique"
      routerLinkActive="active"
      (click)="closeSidebarOnMobile()"
    >
      <i class="feather icon-credit-card"></i>
      <span>Historique Paiement</span>
    </li>

    <li
      routerLink="/paiement"
      routerLinkActive="active"
      (click)="closeSidebarOnMobile()"
    >
      <i class="feather icon-credit-card"></i>
      <span>Paiement</span>
    </li>

    <li
      routerLink="/abonnement"
      routerLinkActive="active"
      (click)="closeSidebarOnMobile()"
    >
      <i class="feather icon-package"></i>
      <span>Abonnement</span>
    </li>
  </ul>

  <div class="logout">
    <button (click)="logout()">
      <i class="feather icon-log-out"></i>
      <span>Déconnexion</span>
    </button>
  </div>
</nav>
