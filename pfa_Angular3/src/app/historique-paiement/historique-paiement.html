<div class="payment-history mt-4">
  <h2>
    <i class="feather icon-credit-card"></i>
    Historique des Paiements
  </h2>

  <div *ngIf="!historique || historique.length === 0" class="alert alert-info">
    Aucun paiement trouvé.
  </div>

  <table *ngIf="historique && historique.length > 0" class="table">
    <thead>
      <tr>
        <th>Nom</th>
        <th>Prénom</th>
        <th>Montant</th>
        <th>Statut</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let h of historique">
        <td>{{ h.nom }}</td>
        <td>{{ h.prenom }}</td>
        <td>{{ h.montant }} DH</td>
        <td>
          <span
            class="badge"
            [ngClass]="{
              'bg-success': h.statutAbonnement === 'ACTIF',
              'bg-danger': h.statutAbonnement === 'INACTIF'
            }"
          >
            {{ h.statutAbonnement }}
          </span>
        </td>
        <td>
          <button
            *ngIf="!h.blocked"
            class="btn btn-danger btn-sm"
            (click)="bloquer(h.userId)"
          >
            Bloquer
          </button>

          <button
            *ngIf="h.blocked"
            class="btn btn-success btn-sm"
            (click)="debloquer(h.userId)"
          >
            Débloquer
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
