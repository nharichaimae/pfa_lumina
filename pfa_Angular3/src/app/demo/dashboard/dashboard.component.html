<h1 class="dashboard-title">{{ 'ADMIN_DASHBOARD.TITLE' | translate }}</h1>

<!-- CARDS -->
<div class="row g-4 mt-2">
  <div
    class="col-xl-3 col-md-6"
    *ngFor="let card of [
      { label: ('ADMIN_DASHBOARD.USERS' | translate), value: data?.totalUsers, color: 'primary' },
      { label: ('ADMIN_DASHBOARD.CLIENTS' | translate), value: data?.totalClients, color: 'info' },
      { label: ('ADMIN_DASHBOARD.ACTIVE_CLIENTS' | translate), value: data?.activeClients, color: 'success' },
      { label: ('ADMIN_DASHBOARD.INACTIVE_CLIENTS' | translate), value: data?.inactiveClients, color: 'danger' }
    ]"
  >
    <div class="stat-card">
      <div class="stat-value">{{ card.value }}</div>
      <div class="stat-label">{{ card.label }}</div>
    </div>
  </div>
</div>

<hr class="my-4" />

<!-- GRAPHIQUES -->
<div class="row g-4 mt-4">

  <!-- Ligne 1 : 2 graphes -->
  <div class="col-xl-6 col-md-6">
    <div class="chart-card">
      <h5 class="chart-title">{{ 'ADMIN_DASHBOARD.USERS_BY_ROLE' | translate }}</h5>
      <apx-chart
        [series]="rolesChart.series"
        [chart]="rolesChart.chart"
        [labels]="rolesChart.labels">
      </apx-chart>
    </div>
  </div>

  <div class="col-xl-6 col-md-6">
    <div class="chart-card">
      <h5 class="chart-title">{{ 'ADMIN_DASHBOARD.TOTALS' | translate }}</h5>
      <apx-chart
        [series]="totalsChart.series"
        [chart]="totalsChart.chart"
        [xaxis]="totalsChart.xaxis">
      </apx-chart>
    </div>
  </div>

  <!-- Ligne 2 : 1 graphe centré -->
  <div class="col-xl-6 col-md-8 mx-auto">
    <div class="chart-card">
      <h5 class="chart-title text-center">{{ 'ADMIN_DASHBOARD.CLIENTS_BY_MONTH' | translate }}</h5>
      <apx-chart
        *ngIf="clientsChart.series?.length"
        [series]="clientsChart.series"
        [chart]="clientsChart.chart"
        [xaxis]="clientsChart.xaxis">
      </apx-chart>

    </div>
  </div>

</div>
