<div class="profile-shell" *ngIf="(profile$ | async) as p">
  <!-- Header -->
  <section class="profile-hero">
    <button class="edit-btn" type="button" (click)="goEdit()">
      <i class="feather icon-edit-2"></i>
      {{ 'PROFILE.EDIT_TITLE' | translate }}
    </button>
    <h1 class="profile-name">
      {{ p.nom }} {{ p.prenom }}
    </h1>
  </section>

  <!-- Card -->
  <section class="profile-card">
    <div class="card-title">
      <i class="feather icon-user"></i>
      <span>{{ 'PROFILE.INFO_TITLE' | translate }}</span>
    </div>
    <div class="grid">
      <!-- Col 1 -->
      <div class="field">
        <div class="label">{{ 'CLIENT.NOM' | translate }}</div>
        <div class="value">{{ p.nom }}</div>
      </div>
      <div class="field">
        <div class="label">{{ 'CLIENT.PRENOM' | translate }}</div>
        <div class="value">{{ p.prenom }}</div>
      </div>
      <!-- Col 2 -->
      <div class="field">
        <div class="label">{{ 'CLIENT.EMAIL' | translate }}</div>
        <div class="value">{{ p.email }}</div>
      </div>
     
    </div>
  </section>
</div>

<!-- States -->
<div class="state" *ngIf="(loading$ | async)">
  {{ 'COMMON.LOADING' | translate }}
</div>
<div class="state state-error" *ngIf="(error$ | async)">
  {{ 'PROFILE.ERROR_LOAD' | translate }}
</div>
