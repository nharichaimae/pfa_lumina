<div class="set-password-wrapper">
  <div class="set-password-card">
    <h2>Définir votre mot de passe</h2>
    <p class="subtitle">
      Entrez votre nouveau mot de passe pour activer votre compte.
    </p>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="password">Nouveau mot de passe</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="Entrez votre mot de passe"
        />
        <small class="error" *ngIf="password?.touched && password?.errors?.['required']">
          Le mot de passe est requis.
        </small>
        <small class="error" *ngIf="password?.touched && password?.errors?.['minlength']">
          Le mot de passe doit contenir au moins 8 caractères.
        </small>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirmer le mot de passe</label>
        <input
          id="confirmPassword"
          type="password"
          formControlName="confirmPassword"
          placeholder="Confirmez votre mot de passe"
        />
        <small class="error" *ngIf="confirmPassword?.touched && confirmPassword?.errors?.['required']">
          La confirmation est requise.
        </small>
      </div>

      <div class="message success" *ngIf="successMessage">
        {{ successMessage }}
      </div>

      <div class="message error-box" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <button type="submit" [disabled]="loading">
        {{ loading ? 'Validation...' : 'Valider' }}
      </button>
    </form>
  </div>
</div>
