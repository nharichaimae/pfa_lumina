<div class="profile-shell" *ngIf="client$ | async as client">
  <div class="profile-hero">
    <a routerLink="/client-profile/edit" class="edit-btn">
      <i class="ti ti-edit"></i>
      {{ 'COMMON.EDIT' | translate }}
    </a>

    <div class="profile-avatar-wrap">
      <img
        *ngIf="client.photoProfil"
        [src]="'http://127.0.0.1:8000/uploads/' + client.photoProfil"
        class="profile-avatar"
        [alt]="'PROFILE.AVATAR_ALT' | translate"
      />
    </div>

    <h1 class="profile-name">{{ client.nom }} {{ client.prenom }}</h1>
    <div class="profile-subtitle">{{ client.email }}</div>
  </div>

  <div class="profile-card">
    <div class="card-title">
      <i class="ti ti-user-circle"></i>
      {{ 'PROFILE.INFO_TITLE' | translate }}
    </div>

    <div class="grid">
      <div class="field">
        <div class="label">{{ 'CLIENT.PHONE' | translate }}</div>
        <div class="value">{{ client.telephone }}</div>
      </div>

      <div class="field">
        <div class="label">{{ 'CLIENT.CIN' | translate }}</div>
        <div class="value">{{ client.cin }}</div>
      </div>

      <div class="field">
        <div class="label">{{ 'CLIENT.EMAIL' | translate }}</div>
        <div class="value email">{{ client.email }}</div>
      </div>

     
    </div>
  </div>
</div>
