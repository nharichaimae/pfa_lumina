<div class="add-form">
  <input [(ngModel)]="newPieceName" [placeholder]="'ADD_PIECE.PLACEHOLDER' | translate">

  <div style="display:flex; align-items:center; gap:10px;">
    <i *ngIf="selectedType"
       [class]="selectedType.icon"
       style="font-size:20px;">
    </i>

    <select [(ngModel)]="selectedTypeId" (change)="onTypeChange()">
      <option *ngFor="let type of uniqueTypes" [value]="type.id_type">
        {{ ('PIECE_TYPES.' + type.nom) | translate }}
      </option>
    </select>
  </div>

  <button (click)="addPiece()">{{ 'ADD_PIECE.ADD' | translate }}</button>
</div>
